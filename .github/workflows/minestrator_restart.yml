name: Minestrator-Restart

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Minestrator-Restart-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: |
          cp private/minestrator_restart.sh minestrator_restart.sh
          chmod +x minestrator_restart.sh

      - name: 🔧 执行拉起任务
        env:
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY || secrets.GOST_PROXY }}
          TG_BOT: ${{ secrets.TG_BOT }}
          MINESTRATOR_API_KEY: ${{ secrets.MINESTRATOR_API_KEY }}
          MINESTRATOR_SERVER_ID: ${{ secrets.MINESTRATOR_SERVER_ID }}
        run: bash minestrator_restart.sh
